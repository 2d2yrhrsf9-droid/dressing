# Relance l'indexeur chaque nuit et republie l'app.
#
# Tout se passe chez GitHub : rien n'a besoin de tourner à la maison. Le dépôt
# doit avoir Pages activé (Settings › Pages › Source : GitHub Actions).

name: Indexer le dressing

on:
  schedule:
    - cron: "17 3 * * *"   # 3 h 17 UTC, quand Vinted est au calme
  workflow_dispatch:        # et à la demande, depuis l'onglet Actions
  push:
    branches: [main]
    # Ce même travail recommite l'index : sans cette exclusion, il se
    # redéclencherait lui-même sans fin.
    paths-ignore:
      - "app/web/index.json"

permissions:
  contents: write   # l'index relevé est recommité dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre l'index à jour
        run: python3 app/indexeur.py

      - name: Garder l'index dans le dépôt
        run: |
          git config user.name "indexeur"
          git config user.email "indexeur@users.noreply.github.com"
          git add app/web/index.json
          git diff --staged --quiet || git commit -m "Relever le dressing du jour"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web

  publier:
    needs: indexer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
