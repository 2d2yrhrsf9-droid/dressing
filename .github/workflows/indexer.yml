# Relance l'indexeur chaque nuit et republie l'app.
#
# Tout se passe chez GitHub : rien n'a besoin de tourner à la maison. Le dépôt
# doit avoir Pages activé (Settings › Pages › Source : GitHub Actions).

name: Indexer le dressing

on:
  schedule:
    # En UTC : soit, heure de Paris, 5 h 17 et 12 h 17 l'été, une heure plus
    # tôt l'hiver. La nuit pour trouver Vinted au calme, midi pour rattraper
    # ce qu'elle a mis en vente le matin.
    - cron: "17 3,10 * * *"
  workflow_dispatch:        # et à la demande, depuis l'onglet Actions
  push:
    branches: [main]
    # Ce même travail recommite ces fichiers : sans cette exclusion, il se
    # redéclencherait lui-même sans fin.
    paths-ignore:
      - "app/web/index.json"
      - "derniere-indexation.txt"

permissions:
  contents: write   # l'index relevé est recommité dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  indexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre l'index à jour
        run: python3 app/indexeur.py

      # GitHub désactive les tâches planifiées d'un dépôt resté soixante jours
      # sans activité humaine — et les poussées faites avec le jeton
      # automatique du workflow ne comptent pas pour de l'activité. D'où
      # l'horodatage, poussé avec un jeton personnel quand il est fourni :
      # c'est ce qui remet le compteur à zéro et garde l'indexation vivante.
      # Sans le secret, tout fonctionne pareil, mais le compteur court.
      - name: Garder l'index dans le dépôt
        env:
          JETON: ${{ secrets.JETON_ACTIVITE }}
        run: |
          date -u +"Dernière indexation : %Y-%m-%d %H:%M UTC" > derniere-indexation.txt
          git config user.name "indexeur"
          git config user.email "indexeur@users.noreply.github.com"
          git add app/web/index.json derniere-indexation.txt
          git diff --staged --quiet && exit 0
          git commit -m "Relever le dressing du jour"
          if [ -n "$JETON" ]; then
            git remote set-url origin \
              "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git push

      # Allume GitHub Pages tout seul si personne ne l'a fait à la main :
      # l'étape de publication échouerait sinon, et le réglage est enfoui.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/web

  publier:
    needs: indexer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
